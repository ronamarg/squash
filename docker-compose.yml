version: '3.8'

services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squash-ml-api
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  default:
    name: squash-network
