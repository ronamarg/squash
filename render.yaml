# Render.com deployment configuration
services:
  - type: web
    name: squash-ml-api
    runtime: python
    plan: free
    rootDir: ml_models
    buildCommand: pip install -r requirements.txt
    startCommand: python -m waitress --host=0.0.0.0 --port=$PORT unified_api:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: OLLAMA_API_KEY
        sync: false
    healthCheckPath: /health
